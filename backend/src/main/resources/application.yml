spring:
  profiles:
    group:
      local: [jwt-auth]
      product: [jwt-auth]
    active: ${SPRING_PROFILES_ACTIVE:local,jwt-auth}
  application:
    name: ${APP_NAME:KLCN-048}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-client-secret}
            redirect-uri: "${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}"
            scope:
              - openid
              - profile
              - email
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    # loại bỏ các trường là null ra khỏi payload
    default-property-inclusion: non_null
  # dùng để quản lý khối upload file
  servlet:
    multipart:
      max-file-size: ${FILE_MULTIPART_MAX_SIZE:10MB}
      max-request-size: ${FILE_MULTIPART_MAX_SIZE:10MB}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  chat:
    rasa:
      base-url: ${RASA_BASE_URL:http://127.0.0.1:5005}
      auth-token: ${RASA_AUTH_TOKEN:}
      timeout-seconds: ${RASA_TIMEOUT_SECONDS:60}
  mail:
    enabled: ${MAIL_ENABLED:false}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  checkout:
    pricing:
      standard-shipping-fee: ${CHECKOUT_STANDARD_SHIPPING_FEE:30000}
      shipping-discount-threshold: ${CHECKOUT_SHIPPING_DISCOUNT_THRESHOLD:600000}
      shipping-discount-amount: ${CHECKOUT_SHIPPING_DISCOUNT_AMOUNT:30000}
      standard-discount-percent: ${CHECKOUT_STANDARD_DISCOUNT_PERCENT:5}
      silver-discount-percent: ${CHECKOUT_SILVER_DISCOUNT_PERCENT:7}
      gold-discount-percent: ${CHECKOUT_GOLD_DISCOUNT_PERCENT:10}
  payment:
    vnpay:
      enabled: ${VNPAY_ENABLED:false}
      ipn-required: ${VNPAY_IPN_REQUIRED:true}
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      return-url: ${VNPAY_RETURN_URL:http://localhost:3000/checkout}
      refund-enabled: ${VNPAY_REFUND_ENABLED:false}
      api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      server-ip: ${VNPAY_SERVER_IP:127.0.0.1}
  order:
    payment-simulation:
      enabled: ${ORDER_PAYMENT_SIMULATION_ENABLED:false}
  project:
    name: ${PROJECT_NAME:Xây dựng website shop thời trang}
    version: 0.1.0-starter
  auth:
    # Chỉ là secret dev; môi trường dùng chung phải đặt JWT_SECRET qua biến môi trường.
#    demo-password: ${DEMO_USER_PASSWORD:Demo@123}
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:HUIT}
      access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:30}
      refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}
      cookie-secure: ${JWT_COOKIE_SECURE:false}
  swagger:
    # Disabled unless explicitly enabled in the local profile.
    auto-open: ${SWAGGER_AUTO_OPEN:false}
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:3000}
  storage:
    root: ${FILE_STORAGE_ROOT:./uploads}
    max-bytes: ${FILE_MAX_BYTES:10485760}
    allowed-content-types: ${FILE_ALLOWED_TYPES:application/pdf,image/png,image/jpeg,text/plain}

cloudflare:
  r2:
    access-key: ${R2_ACCESS_KEY:}
    secret-key: ${R2_SECRET_KEY:}
    bucket: ${R2_BUCKET:}
    endpoint: ${R2_ENDPOINT:}
    public-url: ${R2_PUBLIC_URL:}
