name: Admin CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ['frontend/admin_frontend/**', '.github/workflows/admin-*.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    name: Validate and build Windows
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: frontend/admin_frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install verified Flutter SDK
        env:
          FLUTTER_VERSION: '3.47.0'
        run: |
          $manifest = Invoke-RestMethod 'https://storage.googleapis.com/flutter_infra_release/flutter/releases/releases_windows.json'
          $release = $manifest.releases | Where-Object { $_.version -eq $env:FLUTTER_VERSION -and $_.channel -eq 'stable' } | Select-Object -First 1
          if (-not $release -or -not $release.sha256) { throw "Stable Flutter $env:FLUTTER_VERSION with SHA256 was not found in the official release manifest." }
          $archive = Join-Path $env:RUNNER_TEMP 'flutter-sdk.zip'
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'admin-flutter-sdk'
          Invoke-WebRequest "$($manifest.base_url)/$($release.archive)" -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($actual -ne $release.sha256) { throw 'Flutter SDK checksum mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $sdkRoot
          $flutterBin = Join-Path $sdkRoot 'flutter/bin'
          $flutterBin >> $env:GITHUB_PATH
          & (Join-Path $flutterBin 'flutter.bat') --version
          if ($LASTEXITCODE) { throw 'Flutter SDK initialization failed.' }
      - name: Create isolated test configuration
        run: |
          [IO.File]::WriteAllText((Join-Path $PWD '.env'), "API_BASE_URL=http://127.0.0.1:8080/api/v1`n")
      - name: Restore locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub --coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: admin-coverage
          path: frontend/admin_frontend/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7
      - name: Configure distributable build
        if: github.event_name != 'pull_request'
        env:
          ADMIN_API_BASE_URL: ${{ vars.ADMIN_API_BASE_URL }}
        run: |
          $api = $env:ADMIN_API_BASE_URL
          if ([string]::IsNullOrWhiteSpace($api) -or $api -match '[\r\n]') { throw 'Set the ADMIN_API_BASE_URL repository variable first.' }
          $uri = [Uri]$api
          if (-not $uri.IsAbsoluteUri -or $uri.Scheme -notin @('http', 'https') -or $uri.UserInfo -or $uri.Query -or $uri.Fragment -or $uri.AbsolutePath.TrimEnd('/') -ne '/api/v1') { throw 'API URL must be http(s)://host[:port]/api/v1, without credentials, query or fragment.' }
          if ($uri.Host -in @('localhost', '127.0.0.1', '::1')) { throw 'Distributable builds cannot use a loopback API.' }
          [IO.File]::WriteAllText((Join-Path $PWD '.env'), "API_BASE_URL=$($api.TrimEnd('/'))`n")
      - name: Read application version
        run: |
          $match = [regex]::Match((Get-Content pubspec.yaml -Raw), '(?m)^version:\s*(\d+\.\d+\.\d+)(?:\+\d+)?\s*$')
          if (-not $match.Success) { throw 'Expected a semantic version in pubspec.yaml.' }
          "APP_VERSION=$($match.Groups[1].Value)" >> $env:GITHUB_ENV
      - name: Build Windows
        run: flutter build windows --release --no-pub --build-name=$env:APP_VERSION --build-number=$env:GITHUB_RUN_NUMBER
      - name: Package immutable build and metadata
        if: github.event_name != 'pull_request'
        env:
          ADMIN_API_BASE_URL: ${{ vars.ADMIN_API_BASE_URL }}
        run: |
          $release = 'build/windows/x64/runner/Release'
          if (-not (Get-ChildItem $release -Filter *.exe)) { throw 'Windows executable was not produced.' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$release/*" -DestinationPath dist/zella-admin-windows-x64.zip
          $hash = (Get-FileHash dist/zella-admin-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{
            version = $env:APP_VERSION
            buildNumber = $env:GITHUB_RUN_NUMBER
            sourceSha = $env:GITHUB_SHA
            runId = $env:GITHUB_RUN_ID
            flutterVersion = '3.47.0'
            apiBaseUrl = $env:ADMIN_API_BASE_URL.TrimEnd('/')
            sha256 = $hash
          } | ConvertTo-Json | Set-Content dist/manifest.json -Encoding utf8
          "$hash  zella-admin-windows-x64.zip" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - name: Upload candidate for release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: admin-windows-build
          path: frontend/admin_frontend/dist/*
          if-no-files-found: error
          retention-days: 14
