name: Docker CI & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/docker-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Docker login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ vars.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t "${{ vars.DOCKERHUB_USERNAME }}/zbe:latest" -f ./backend/Dockerfile ./backend
          docker push "${{ vars.DOCKERHUB_USERNAME }}/zbe:latest"

      - name: SSH to VPS and Deploy Container
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          DOCKER_USER: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "::error::VPS_HOST or VPS_SSH_KEY secret is not set!"
            exit 1
          fi

          mkdir -p ~/.ssh
          
          # Ho tro ca dang Base64 hoac dang Plaintext Private Key
          if echo "$SSH_KEY" | grep -q "BEGIN"; then
            printf "%s\n" "$SSH_KEY" > ~/.ssh/id_ed25519
          else
            echo "$SSH_KEY" | base64 -d > ~/.ssh/id_ed25519
          fi
          
          chmod 600 ~/.ssh/id_ed25519
          
          echo "Checking SSH key validity:"
          ssh-keygen -l -f ~/.ssh/id_ed25519 || { echo "::error::Invalid SSH private key!"; exit 1; }
          
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=15 \
              -p $VPS_PORT \
              "$VPS_USER@$VPS_HOST" "
            set -e
            echo '--- Pulling latest image from Docker Hub ---'
            sudo docker pull $DOCKER_USER/zbe:latest

            echo '--- Stopping and removing old container ---'
            sudo docker stop zella-backend || true
            sudo docker rm zella-backend || true

            echo '--- Starting new container ---'
            sudo docker run -d --name zella-backend \
              --restart unless-stopped \
              -p 8080:8080 \
              --mount type=bind,src=/home/ubuntu/application-product.properties,dst=/app/config/application-product.properties,readonly \
              --mount type=bind,src=/home/ubuntu/rds-truststore.jks,dst=/app/config/rds-truststore.jks,readonly \
              $DOCKER_USER/zbe:latest

            echo '--- Cleaning up dangling images ---'
            sudo docker image prune -f
            echo '--- Deployment finished successfully! ---'
          "
