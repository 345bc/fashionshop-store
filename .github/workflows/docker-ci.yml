name: Docker CI & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/docker-ci.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Get short commit SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Docker Hub login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/zbe:latest
            ${{ vars.DOCKERHUB_USERNAME }}/zbe:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH to VPS and Deploy Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "--- Pulling latest image from Docker Hub ---"
            sudo docker pull ${{ vars.DOCKERHUB_USERNAME }}/zbe:latest

            echo "--- Stopping and removing old container ---"
            sudo docker stop zella-backend || true
            sudo docker rm zella-backend || true

            echo "--- Starting new container ---"
            sudo docker run -d --name zella-backend \
              --restart unless-stopped \
              -p 8080:8080 \
              --mount type=bind,src=/home/ubuntu/application-product.properties,dst=/app/config/application-product.properties,readonly \
              --mount type=bind,src=/home/ubuntu/rds-truststore.jks,dst=/app/config/rds-truststore.jks,readonly \
              ${{ vars.DOCKERHUB_USERNAME }}/zbe:latest

            echo "--- Cleaning up dangling images ---"
            sudo docker image prune -f
